<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>القناويه|للتسويق والاستثمار العقاري</title>
<style>
:root{--gold:#d8ad58;--gold2:#f2d48e;--bg:#090909;--panel:#141414;--muted:#b9b2a4;--line:#393124}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f5ee;font-family:Tahoma,Arial,sans-serif}
.wrap{width:min(1120px,92%);margin:auto}
header{position:sticky;top:0;z-index:10;background:#080808ed;border-bottom:1px solid #302719}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;font-weight:bold}.brand img{width:54px;height:54px;border-radius:50%;border:1px solid var(--gold)}
.brand span{color:var(--gold2)}
.btn{display:inline-flex;padding:11px 19px;border-radius:8px;background:linear-gradient(135deg,#f1d18a,#b98431);color:#17110a;font-weight:bold;text-decoration:none}
.hero{padding:70px 0;text-align:center;background:radial-gradient(ellipse at 50% 0%,#60471e55,transparent 60%),#080808}
.kicker{color:var(--gold2)}.hero h1{font-size:clamp(28px,5vw,50px)}.hero h1 em{color:var(--gold2);font-style:normal}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.area{padding:20px;text-align:center;background:#1b1812;border:1px solid var(--line);border-radius:12px}
.area b{color:var(--gold2);display:block}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:20px}
select,input{width:100%;padding:12px;background:#0b0b0b;color:#fff;border:1px solid #51432c;border-radius:8px}
.listings{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.empty{grid-column:1/-1;text-align:center;padding:30px;border:1px dashed #65502e;border-radius:12px;color:var(--muted)}
@media(max-width:800px){.areas,.filters,.listings{grid-template-columns:1fr 1fr}}@media(max-width:520px){.areas,.filters,.listings{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#"><img src="logo.jpg"><span>القناوية للتسويق العقاري</span></a><a class="btn" href="https://wa.me/201104185245">واتساب</a></div></header>
<main>
<section class="hero"><div class="wrap"><div class="kicker">ثقتكم أساس استثمارنا</div><h1>اختار بيتك… <em>وخلّي علينا</em> البحث</h1><a class="btn" href="#properties">تصفح العقارات</a></div></section>
<section id="properties"><div class="wrap" style="padding:40px 0"><h2 style="text-align:center">العقارات - من الشيت مباشرة</h2>
<div class="filters">
<select id="kind"><option value="">كل الأنواع</option><option>تمليك</option><option>إيجار قديم</option><option>إيجار جديد</option></select>
<select id="area"><option value="">كل المناطق</option></select>
<select id="rooms"><option value="">الغرف</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
<input id="search" placeholder="ابحث بالكود">
</div>
<div class="listings" id="listingGrid"><div class="empty">جاري التحميل من الشيت...</div></div>
</div></section>
</main>
<script>
const SHEET_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRmZjnseG8F209I1DuBszQ9EkYyXWPjT9U-lEdOejpyhf29BTPic35iQBGGUnINCS6-Nefys003iK2x/pub?gid=2087716127&single=true&output=csv";
let properties=[];const grid=document.getElementById('listingGrid');
async function loadFromSheet(){
 try{
  const r=await fetch(SHEET_CSV_URL+'&_='+Date.now());const t=await r.text();
  const lines=t.trim().split(/\r?\n/);
  properties=lines.slice(1).map(line=>{
   const c=line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,'').trim());
   return{code:c[0]||'',price:c[1]||'',title:c[2]||'',area:c[3]||'',floor:c[4]||'',details:c[5]||'',video:c[6]||'',phone:c[7]||'01104185245',kind:c[8]||'تمليك',rooms:c[9]||'3'};
  }).filter(p=>p.code);
  const sel=document.getElementById('area');const uniq=[...new Set(properties.map(p=>p.area).filter(Boolean))];
  sel.innerHTML='<option value="">كل المناطق</option>'+uniq.map(a=>`<option value="${a}">${a}</option>`).join('');
  render();
 }catch(e){grid.innerHTML='<div class="empty">خطأ: '+e.message+'</div>';}
}
function render(){
 const k=document.getElementById('kind').value;const a=document.getElementById('area').value;const r=document.getElementById('rooms').value;const s=document.getElementById('search').value.trim();
 const found=properties.filter(p=>(!k||p.kind===k)&&(!a||p.area===a)&&(!r||p.rooms===r)&&(!s||p.code.includes(s)));
 if(!found.length){grid.innerHTML='<div class="empty">لا يوجد نتائج - ضيفي شقق في الشيت<br>عمود D هو المنطقة: المعادي / دار السلام / البساتين / حدائق المعادي</div>';return;}
 grid.innerHTML=found.map(p=>{
  let msg=encodeURIComponent('بستفسر عن شقه كود '+p.code+' - '+p.area);
  let media='';if(p.video){if(p.video.includes('drive.google.com')){const m=p.video.match(/\/d\/([^\/]+)/);const id=m?m[1]:'';media=`<iframe src="https://drive.google.com/file/d/${id}/preview" style="width:100%;height:220px;border:0;background:#000" allowfullscreen></iframe>`;}else{media=`<video src="${p.video}" controls style="width:100%;height:220px;background:#000"></video>`;}}else{media=`<div style="height:220px;background:#1a1814;display:grid;place-items:center">🏠</div>`;}
  let det=(p.details||'').split('-').filter(Boolean).map(t=>`<div>◆ ${t.trim()}</div>`).join('');
  return `<article style="background:#141414;border:1px solid #393124;border-radius:12px;overflow:hidden">${media}<div style="padding:14px"><div style="display:flex;justify-content:space-between"><span style="border:1px solid #d8ad58;color:#d8ad58;padding:2px 8px;border-radius:20px;font-size:11px">كود ${p.code}</span><span style="font-size:11px">${p.area}</span></div><h3 style="color:#f2d48e;text-align:center;margin:8px 0">سعر: ${p.price}</h3><div style="text-align:center;font-size:13px">${p.title}<br><small style="opacity:.6">${p.floor}</small></div><div style="margin-top:8px;font-size:13px">${det}</div><div style="margin-top:10px;text-align:center;font-weight:bold;direction:ltr">${p.phone}</div><div style="display:flex;gap:8px;margin-top:8px"><a href="tel:${p.phone}" style="
